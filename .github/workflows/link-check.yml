name: Link Check

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - '**.md'
  schedule:
    - cron: '0 9 * * 1'  # Weekly Monday 9am
  workflow_dispatch:

jobs:
  link-check:
    name: Link Check
    uses: zavestudios/platform-pipelines/.github/workflows/link-check.yml@23f7b203cfb67d9b4dd7861e655570854a9bb45e # main
    with:
      fail_on_error: false  # Don't block PRs, just warn