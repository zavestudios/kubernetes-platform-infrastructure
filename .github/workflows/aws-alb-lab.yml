name: AWS ALB Lab

on:
  pull_request:
    paths:
      - ".github/workflows/aws-alb-lab.yml"
      - "terraform-aws-alb-lab/**"
  workflow_dispatch:
    inputs:
      operation:
        description: "Terraform operation to prepare"
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-alb-lab
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_ALB_LAB_REGION || 'us-west-2' }}
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VERSION: "1.17.2"
  TF_WORKING_DIR: terraform-aws-alb-lab

jobs:
  validate:
    name: Validate (${{ matrix.directory }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        directory:
          - terraform-aws-alb-lab
          - terraform-aws-alb-lab/bootstrap
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Check formatting
        run: terraform fmt -check -recursive
        working-directory: ${{ matrix.directory }}

      - name: Initialize without a backend
        run: terraform init -backend=false -lockfile=readonly
        working-directory: ${{ matrix.directory }}

      - name: Validate configuration
        run: terraform validate
        working-directory: ${{ matrix.directory }}

      - name: Run mocked plan tests
        run: terraform test
        working-directory: ${{ matrix.directory }}

  pull-request-plan:
    name: Speculative plan
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.AWS_ALB_LAB_ACCOUNT_ID != '' &&
      vars.AWS_ALB_LAB_PLAN_ROLE_ARN != '' &&
      vars.AWS_ALB_LAB_STATE_BUCKET != ''
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure read-only AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          allowed-account-ids: ${{ vars.AWS_ALB_LAB_ACCOUNT_ID }}
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ALB_LAB_PLAN_ROLE_ARN }}

      - name: Initialize remote state
        run: >-
          terraform init -lockfile=readonly
          -backend-config="bucket=${{ vars.AWS_ALB_LAB_STATE_BUCKET }}"
          -backend-config="region=${{ env.AWS_REGION }}"
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Produce speculative plan
        run: terraform plan -no-color
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_aws_region: ${{ env.AWS_REGION }}

  prepare-operation:
    name: Prepare ${{ inputs.operation }}
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - name: Check required repository variables
        env:
          ACCOUNT_ID: ${{ vars.AWS_ALB_LAB_ACCOUNT_ID }}
          PLAN_ROLE_ARN: ${{ vars.AWS_ALB_LAB_PLAN_ROLE_ARN }}
          STATE_BUCKET: ${{ vars.AWS_ALB_LAB_STATE_BUCKET }}
        run: |
          test -n "$ACCOUNT_ID" || { echo "AWS_ALB_LAB_ACCOUNT_ID is not set" >&2; exit 1; }
          test -n "$PLAN_ROLE_ARN" || { echo "AWS_ALB_LAB_PLAN_ROLE_ARN is not set" >&2; exit 1; }
          test -n "$STATE_BUCKET" || { echo "AWS_ALB_LAB_STATE_BUCKET is not set" >&2; exit 1; }

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure read-only AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          allowed-account-ids: ${{ vars.AWS_ALB_LAB_ACCOUNT_ID }}
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ALB_LAB_PLAN_ROLE_ARN }}

      - name: Initialize remote state
        run: >-
          terraform init -lockfile=readonly
          -backend-config="bucket=${{ vars.AWS_ALB_LAB_STATE_BUCKET }}"
          -backend-config="region=${{ env.AWS_REGION }}"
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Prepare saved plan
        run: |
          if [ "${{ inputs.operation }}" = "destroy" ]; then
            terraform plan -destroy -out=tfplan -no-color
          else
            terraform plan -out=tfplan -no-color
          fi
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_aws_region: ${{ env.AWS_REGION }}

      - name: Upload approved-plan candidate
        if: inputs.operation != 'plan'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aws-alb-lab-${{ inputs.operation }}-${{ github.run_id }}
          path: |
            ${{ env.TF_WORKING_DIR }}/tfplan
            ${{ env.TF_WORKING_DIR }}/lambda/function.zip
          if-no-files-found: error
          retention-days: 1

  execute-operation:
    name: Execute ${{ inputs.operation }}
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.operation == 'apply' || inputs.operation == 'destroy')
    needs: prepare-operation
    runs-on: ubuntu-24.04
    environment: aws-alb-lab
    steps:
      - name: Check required repository variables
        env:
          ACCOUNT_ID: ${{ vars.AWS_ALB_LAB_ACCOUNT_ID }}
          DEPLOY_ROLE_ARN: ${{ vars.AWS_ALB_LAB_DEPLOY_ROLE_ARN }}
          STATE_BUCKET: ${{ vars.AWS_ALB_LAB_STATE_BUCKET }}
        run: |
          test -n "$ACCOUNT_ID" || { echo "AWS_ALB_LAB_ACCOUNT_ID is not set" >&2; exit 1; }
          test -n "$DEPLOY_ROLE_ARN" || { echo "AWS_ALB_LAB_DEPLOY_ROLE_ARN is not set" >&2; exit 1; }
          test -n "$STATE_BUCKET" || { echo "AWS_ALB_LAB_STATE_BUCKET is not set" >&2; exit 1; }

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure deployment AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          allowed-account-ids: ${{ vars.AWS_ALB_LAB_ACCOUNT_ID }}
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ALB_LAB_DEPLOY_ROLE_ARN }}

      - name: Initialize remote state
        run: >-
          terraform init -lockfile=readonly
          -backend-config="bucket=${{ vars.AWS_ALB_LAB_STATE_BUCKET }}"
          -backend-config="region=${{ env.AWS_REGION }}"
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Download saved plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: aws-alb-lab-${{ inputs.operation }}-${{ github.run_id }}
          path: ${{ env.TF_WORKING_DIR }}

      - name: Apply reviewed plan
        run: terraform apply -no-color tfplan
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_aws_region: ${{ env.AWS_REGION }}
