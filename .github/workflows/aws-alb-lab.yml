name: AWS ALB Lab

on:
  pull_request:
    paths:
      - ".github/workflows/aws-alb-lab.yml"
      - "terraform-aws-alb-lab/**"
  workflow_dispatch:
    inputs:
      operation:
        description: "Terraform operation to prepare"
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-alb-lab
  cancel-in-progress: false

jobs:
  terraform:
    uses: zavestudios/platform-pipelines/.github/workflows/terraform-aws-delivery.yml@4fc7e61447ffb44c8934031667f48d968df5d8a3
    with:
      operation: ${{ inputs.operation || 'plan' }}
      terraform-version: "1.17.2"
      working-directory: terraform-aws-alb-lab
      aws-region: ${{ vars.AWS_ALB_LAB_REGION || 'us-west-2' }}
      aws-account-id: ${{ vars.AWS_ALB_LAB_ACCOUNT_ID }}
      state-bucket: ${{ vars.AWS_ALB_LAB_STATE_BUCKET }}
      plan-role-arn: ${{ vars.AWS_ALB_LAB_PLAN_ROLE_ARN }}
      apply-role-arn: ${{ vars.AWS_ALB_LAB_APPLY_ROLE_ARN }}
      apply-environment: aws-alb-lab
      artifact-prefix: aws-alb-lab
      additional-artifact-paths: terraform-aws-alb-lab/lambda/function.zip
